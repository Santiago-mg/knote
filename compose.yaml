services:
  mongo:
    image: mongo:7
    container_name: knote-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:RELEASE.2022-10-29T06-21-33Z
    container_name: knote-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mykey
      MINIO_ROOT_PASSWORD: mysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  app:
    build: .
    image: knote:2.0.0
    container_name: knote-app
    depends_on:
      - mongo
      - minio
    environment:
      MONGO_URL: mongodb://mongo:27017/dev
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: mykey
      MINIO_SECRET_KEY: mysecret
      MINIO_BUCKET: image-storage
    ports:
      - "8080:8080"

volumes:
  mongo-data:
  minio-data:
